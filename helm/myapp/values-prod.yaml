# Surcharges illustratives pour un environnement de production.
#
# NOT YET VERIFIED - ce projet ne fait tourner qu'un seul environnement
# (dev, sur le cluster low-cost décrit dans le README principal). Ce
# fichier documente comment la configuration différerait en production
# (plus de réplicas, plus de ressources, autoscaling plus large), mais
# n'a jamais été appliqué contre une infrastructure réelle - ne pas le
# présenter comme testé.

env:
  APP_ENV: production

replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2
